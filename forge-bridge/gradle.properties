# Gradle 运行参数
# 说明：ForgeGradle 需要较多堆内存来反编译/重映射 Minecraft，这里给到 3G。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
# 不使用常驻守护进程，保证构建结束后进程干净退出（CI 友好）。
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## 环境参数（与 Forge 版本强相关）
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# 47.4.x 系列的最新补丁版本
forge_version=47.4.29
forge_version_range=[47,)
loader_version_range=[47,)
# 映射通道：ForgeGradle 下使用 Mojang 官方映射
mapping_channel=official
mapping_version=1.20.1

## 模组元数据
mod_id=readerbridge
mod_name=ReaderBridge alpha v0.06.2
mod_license=MIT
mod_version=0.6.2-alpha
mod_group_id=com.feiyu.readerbridge
mod_authors=feiyu, Little Code Sauce
# 原描述还停留在「只是个桥接模组」的年代，现在阅读栈、书源、TTS 全在模组内自洽，
# 只剩读取状态 API 对外暴露，按现状改写，避免 Forge 模组列表里给出误导信息。
mod_description=Self-contained in-game novel reader and TTS player. Built-in offline rule sources, optional local TXT import, and an OpenAL audio pipeline; exposes a read-only reading-state API to other mods.
